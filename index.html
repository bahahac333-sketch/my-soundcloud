<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 SoundCloud Clone</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Interstate', 'Lucida Grande', Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            min-height: 100vh;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes playingPulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(255,85,0,0.4); }
            50% { box-shadow: 0 10px 40px rgba(255,85,0,0.8); }
        }

        @keyframes wave {
            0%, 100% { height: 20%; }
            50% { height: 100%; }
        }

        @keyframes likeAnimation {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .header {
            background: linear-gradient(135deg, #ff5500 0%, #ff8800 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(255, 85, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .nav-buttons button {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 20px;
            margin-left: 10px;
            cursor: pointer;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .nav-buttons button:hover {
            background: white;
            color: #ff5500;
            transform: translateY(-2px);
        }

        .user-info {
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }

        .user-avatar:hover {
            transform: scale(1.1);
            border-color: white;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%);
            margin: 8% auto;
            padding: 40px;
            border-radius: 20px;
            width: 450px;
            max-width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease;
        }

        .modal-content h2 {
            margin-bottom: 25px;
            color: #333;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #ff5500;
            box-shadow: 0 0 10px rgba(255,85,0,0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff5500 0%, #ff8800 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255,85,0,0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,85,0,0.4);
        }

        .switch-auth {
            text-align: center;
            margin-top: 20px;
            color: #666;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .switch-auth:hover {
            color: #ff5500;
        }

        .upload-section {
            display: none;
            background: rgba(255,255,255,0.95);
            margin: 30px auto;
            padding: 40px;
            max-width: 800px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s ease;
        }

        .upload-area {
            border: 3px dashed #ff5500;
            padding: 60px;
            text-align: center;
            border-radius: 15px;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #fff5f0 0%, #ffffff 100%);
        }

        .upload-area:hover {
            border-color: #ff8800;
            background: #fff5f0;
            transform: scale(1.02);
        }

        .tracks-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            color: white;
            font-size: 32px;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .track-item {
            background: rgba(255, 255, 255, 0.95);
            margin-bottom: 20px;
            padding: 25px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .track-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,85,0,0.1), transparent);
            transition: left 0.5s;
        }

        .track-item:hover::before {
            left: 100%;
        }

        .track-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255,85,0,0.3);
        }

        .track-cover {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            margin-right: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .track-info {
            flex: 1;
        }

        .track-title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .track-author {
            color: #999;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .track-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .play-btn {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #ff5500 0%, #ff8800 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255,85,0,0.4);
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 6px 20px rgba(255,85,0,0.6);
        }

        .like-btn {
            background: transparent;
            border: 2px solid #ff5500;
            color: #ff5500;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .like-btn:hover {
            background: rgba(255,85,0,0.1);
            transform: scale(1.05);
        }

        .like-btn.liked {
            background: linear-gradient(135deg, #ff5500 0%, #ff8800 100%);
            color: white;
            border-color: transparent;
        }

        .delete-btn {
            background: transparent;
            border: 2px solid #ccc;
            color: #666;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
        }

        .player {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #2d2d44 0%, #1e1e2e 100%);
            color: white;
            padding: 20px;
            box-shadow: 0 -4px 30px rgba(0,0,0,0.5);
            z-index: 99;
        }

        .player-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .player-cover {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .player-info {
            flex: 1;
            min-width: 200px;
        }

        .player-title {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 16px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 2;
        }

        .progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time-display {
            font-size: 13px;
            color: #ccc;
            min-width: 50px;
        }

        .seek-slider, .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
            height: 8px;
        }

        .seek-slider {
            flex: 1;
        }

        .volume-slider {
            width: 120px;
        }

        .seek-slider::-webkit-slider-thumb,
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #ff5500 0%, #ff8800 100%);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .seek-slider::-moz-range-thumb,
        .volume-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #ff5500 0%, #ff8800 100%);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-icon {
            font-size: 22px;
            cursor: pointer;
        }

        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        .success-message {
            color: #28a745;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: white;
        }

        .empty-state h3 {
            margin-bottom: 15px;
            font-size: 28px;
        }

        .file-label {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(135deg, #ff5500 0%, #ff8800 100%);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            margin: 15px 0;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .file-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255,85,0,0.4);
        }

        input[type="file"] {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }

        .waveform {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50px;
            display: flex;
            align-items: flex-end;
            gap: 2px;
            padding: 0 8px;
            opacity: 0.3;
            pointer-events: none;
        }

        .wave-bar {
            flex: 1;
            background: linear-gradient(to top, #ff5500, #ff8800);
            border-radius: 2px 2px 0 0;
            animation: wave 1.2s ease-in-out infinite;
        }

        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { animation-delay: 0.5s; }

        .close-modal {
            float: right;
            font-size: 32px;
            font-weight: bold;
            color: #999;
            cursor: pointer;
            line-height: 20px;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            color: #ff5500;
            transform: rotate(90deg);
        }

        .upload-form {
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🎵 SoundCloud</div>
        <div id="navButtons" class="nav-buttons">
            <button onclick="showLogin()">Войти</button>
            <button onclick="showRegister()">Регистрация</button>
        </div>
        <div id="userInfo" class="user-info" style="display: none;">
            <div id="userAvatar" class="user-avatar">👤</div>
            <span id="username" style="cursor: pointer; font-weight: bold;"></span>
            <button onclick="showSaved()" id="savedBtn" style="background: rgba(255,255,255,0.2); border: 2px solid white; color: white; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold;">❤️ Сохранённые</button>
            <button onclick="showUpload()" style="background: rgba(255,255,255,0.2); border: 2px solid white; color: white; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold;">📤 Загрузить</button>
            <button onclick="logout()" style="background: transparent; border: 2px solid white; color: white; padding: 10px 20px; border-radius: 25px; cursor: pointer;">Выйти</button>
        </div>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('loginModal')">&times;</span>
            <h2>🎵 Вход</h2>
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="loginUsername" placeholder="Введите имя пользователя">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="loginPassword" placeholder="Введите пароль">
            </div>
            <button class="btn-primary" onclick="login()">Войти</button>
            <div id="loginError" class="error-message"></div>
            <div class="switch-auth" onclick="showRegister()">Нет аккаунта? Зарегистрируйтесь</div>
        </div>
    </div>

    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('registerModal')">&times;</span>
            <h2>✨ Регистрация</h2>
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="registerUsername" placeholder="Введите имя пользователя">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="registerPassword" placeholder="Введите пароль">
            </div>
            <button class="btn-primary" onclick="register()">Зарегистрироваться</button>
            <div id="registerError" class="error-message"></div>
            <div class="switch-auth" onclick="showLogin()">Уже есть аккаунт? Войдите</div>
        </div>
    </div>

    <!-- Lyrics Modal -->
    <div id="lyricsModal" class="modal">
        <div class="modal-content" style="width:600px; max-width:95%; max-height:80vh; overflow-y:auto;">
            <span class="close-modal" onclick="closeModal('lyricsModal')">&times;</span>
            <h2 id="lyricsTitleModal" style="margin-bottom:5px;"></h2>
            <p id="lyricsAuthorModal" style="color:#999; margin-bottom:20px; font-size:14px;"></p>
            <div id="lyricsText" style="white-space:pre-wrap; line-height:1.8; font-size:15px; color:#333; background:#f8f8f8; padding:20px; border-radius:12px;"></div>
        </div>
    </div>

    <!-- Saved Tracks Modal -->
    <div id="savedModal" class="modal">
        <div class="modal-content" style="width: 700px; max-width: 95%; max-height: 80vh; overflow-y: auto;">
            <span class="close-modal" onclick="closeModal('savedModal')">&times;</span>
            <h2>❤️ Сохранённые треки</h2>
            <div id="savedList" style="margin-top: 20px;"></div>
        </div>
    </div>

    <div id="uploadSection" class="upload-section">
        <h2 style="margin-bottom: 20px; color: #333; font-size: 28px;">📤 Загрузить трек</h2>
        <div class="upload-area" onclick="document.getElementById('audioFile').click()">
            <p style="font-size: 24px; margin-bottom: 15px;">🎵 Выберите аудио файл</p>
            <p style="color: #999;">Поддерживаемые форматы: MP3, WAV, OGG</p>
            <p style="color: #ff8800; margin-top: 8px; font-size: 13px;">⚠️ Максимальный размер файла: 9 МБ</p>
        </div>
        <input type="file" id="audioFile" accept="audio/*" onchange="handleAudioSelect(event)">
        
        <div id="uploadForm" class="upload-form">
            <div class="form-group">
                <label>Название трека</label>
                <input type="text" id="trackTitle" placeholder="Введите название">
            </div>
            <div class="form-group">
                <label>Текст песни (необязательно)</label>
                <textarea id="trackLyrics" placeholder="Вставьте текст песни сюда..." style="width:100%; padding:12px; border:2px solid #e0e0e0; border-radius:10px; font-size:14px; min-height:150px; resize:vertical; font-family:inherit; transition:all 0.3s ease;"></textarea>
            </div>
            <div class="form-group">
                <label>Обложка трека (необязательно)</label>
                <label for="coverFile" class="file-label">📷 Выбрать изображение</label>
                <input type="file" id="coverFile" accept="image/*">
                <div id="coverPreview"></div>
            </div>
            <button class="btn-primary" onclick="uploadTrack()">🚀 Опубликовать трек</button>
            <div id="uploadError" class="error-message"></div>
            <div id="uploadSuccess" class="success-message"></div>
        </div>
    </div>

    <div class="tracks-container">
        <h2 class="section-title">🔥 Популярные треки</h2>
        <div id="tracksList"></div>
    </div>

    <div id="player" class="player">
        <div class="player-content">
            <img id="playerCover" class="player-cover" src="" alt="">
            <div class="player-info">
                <div id="playerTitle" class="player-title"></div>
                <div id="playerAuthor" style="color: #ccc; font-size: 13px;"></div>
            </div>
            <div class="player-controls">
                <button class="play-btn" onclick="togglePlay()" id="playPauseBtn" style="width: 50px; height: 50px; font-size: 18px;">▶</button>
                <div class="progress-container">
                    <span id="currentTime" class="time-display">0:00</span>
                    <input type="range" id="seekSlider" class="seek-slider" min="0" max="100" value="0">
                    <span id="duration" class="time-display">0:00</span>
                </div>
                <div class="volume-container">
                    <span id="volumeIcon" class="volume-icon" onclick="toggleMute()">🔊</span>
                    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="100">
                </div>
                <audio id="audioPlayer"></audio>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDt5yps3eRaGD4G58XiHM0anZDG8NgEidQ",
            authDomain: "my-soundcloud-d1433.firebaseapp.com",
            databaseURL: "https://my-soundcloud-d1433-default-rtdb.firebaseio.com",
            projectId: "my-soundcloud-d1433",
            storageBucket: "my-soundcloud-d1433.firebasestorage.app",
            messagingSenderId: "441554901767",
            appId: "1:441554901767:web:f107e1ce7a459650cec3a2"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentUser = null;
        let currentTrack = null;
        let tracksListener = null;

        window.onload = async function() {
            await checkAuth();
            await loadTracks();
            
            window.onclick = function(event) {
                if (event.target.classList.contains('modal')) {
                    event.target.style.display = 'none';
                }
            }
        };

        async function checkAuth() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = savedUser;
                updateUI();
            }
        }

        function updateUI() {
            if (currentUser) {
                document.getElementById('navButtons').style.display = 'none';
                document.getElementById('userInfo').style.display = 'flex';
                document.getElementById('username').textContent = currentUser;
            } else {
                document.getElementById('navButtons').style.display = 'block';
                document.getElementById('userInfo').style.display = 'none';
                document.getElementById('uploadSection').style.display = 'none';
            }
        }

        function showLogin() {
            document.getElementById('loginModal').style.display = 'block';
            document.getElementById('registerModal').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('registerModal').style.display = 'block';
            document.getElementById('loginModal').style.display = 'none';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        async function register() {
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value;
            const errorDiv = document.getElementById('registerError');

            if (!username || !password) {
                errorDiv.textContent = 'Заполните все поля';
                return;
            }

            try {
                const userRef = database.ref('users/' + username);
                const snapshot = await userRef.once('value');
                
                if (snapshot.exists()) {
                    errorDiv.textContent = 'Пользователь уже существует';
                    return;
                }

                await userRef.set({ password: password });
                errorDiv.textContent = '';
                alert('✅ Регистрация успешна! Войдите в систему.');
                showLogin();
            } catch (error) {
                console.error('Registration error:', error);
                errorDiv.textContent = 'Ошибка регистрации';
            }
        }

        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');

            if (!username || !password) {
                errorDiv.textContent = 'Заполните все поля';
                return;
            }

            try {
                if (username === 'admin' && password === 'kaka1488') {
                    currentUser = username;
                    localStorage.setItem('currentUser', username);
                    closeModal('loginModal');
                    updateUI();
                    await loadTracks();
                    return;
                }

                const userRef = database.ref('users/' + username);
                const snapshot = await userRef.once('value');
                const userData = snapshot.val();
                
                if (!userData || userData.password !== password) {
                    errorDiv.textContent = 'Неверное имя пользователя или пароль';
                    return;
                }

                currentUser = username;
                localStorage.setItem('currentUser', username);
                closeModal('loginModal');
                errorDiv.textContent = '';
                updateUI();
                await loadTracks();
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Ошибка входа';
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            updateUI();
            loadTracks();
        }

        function showUpload() {
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('uploadSection').scrollIntoView({ behavior: 'smooth' });
        }

        function handleAudioSelect(event) {
            const file = event.target.files[0];
            if (file && file.type.startsWith('audio/')) {
                document.getElementById('uploadForm').style.display = 'block';
            }
        }

        async function uploadTrack() {
            const title = document.getElementById('trackTitle').value.trim();
            const audioFile = document.getElementById('audioFile').files[0];
            const coverFile = document.getElementById('coverFile').files[0];
            const errorDiv = document.getElementById('uploadError');
            const successDiv = document.getElementById('uploadSuccess');

            if (!title || !audioFile) {
                errorDiv.textContent = 'Заполните все обязательные поля';
                return;
            }

            // Check file size (Realtime DB limit ~10MB per node)
            if (audioFile.size > 9 * 1024 * 1024) {
                errorDiv.textContent = '❌ Файл слишком большой! Максимум 9 МБ. Используйте MP3 файлы меньшего размера.';
                return;
            }

            try {
                errorDiv.textContent = '';
                successDiv.innerHTML = '⏳ Конвертация аудио... <b id="progressText">0%</b>';

                const trackId = 'track_' + Date.now();

                // Convert audio to base64
                const audioBase64 = await fileToBase64WithProgress(audioFile, (pct) => {
                    const el = document.getElementById('progressText');
                    if (el) el.textContent = pct + '%';
                });

                successDiv.innerHTML = '🖼️ Обработка обложки...';

                // Convert cover to base64 if exists
                let coverBase64 = null;
                if (coverFile) {
                    if (coverFile.size > 2 * 1024 * 1024) {
                        coverBase64 = await resizeImage(coverFile, 400, 400);
                    } else {
                        coverBase64 = await fileToBase64(coverFile);
                    }
                }

                successDiv.innerHTML = '💾 Сохранение в базу данных...';

                // Save everything to Realtime Database
                await database.ref('tracks/' + trackId).set({
                    id: trackId,
                    title: title,
                    author: currentUser,
                    audioData: audioBase64,
                    coverData: coverBase64,
                    lyrics: document.getElementById('trackLyrics').value.trim(),
                    timestamp: Date.now()
                });

                successDiv.textContent = '✅ Трек успешно загружен!';

                document.getElementById('trackTitle').value = '';
                document.getElementById('trackLyrics').value = '';
                document.getElementById('audioFile').value = '';
                document.getElementById('coverFile').value = '';
                document.getElementById('coverPreview').innerHTML = '';
                document.getElementById('uploadForm').style.display = 'none';

                setTimeout(() => {
                    successDiv.textContent = '';
                    document.getElementById('uploadSection').style.display = 'none';
                }, 2000);
            } catch (error) {
                console.error('Upload error:', error);
                if (error.message && error.message.includes('13 INTERNAL')) {
                    errorDiv.innerHTML = '❌ Файл слишком большой для базы данных!<br>Попробуйте MP3 файл меньше 9 МБ.';
                } else {
                    errorDiv.textContent = '❌ Ошибка: ' + (error.message || error.code);
                }
                successDiv.textContent = '';
            }
        }

        function fileToBase64WithProgress(file, onProgress) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onprogress = (e) => {
                    if (e.lengthComputable) {
                        onProgress(Math.round((e.loaded / e.total) * 100));
                    }
                };
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function resizeImage(file, maxW, maxH) {
            return new Promise((resolve) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxW) { h = h * maxW / w; w = maxW; }
                    if (h > maxH) { w = w * maxH / h; h = maxH; }
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = url;
            });
        }

        async function loadTracks() {
            const tracksDiv = document.getElementById('tracksList');
            tracksDiv.innerHTML = '<div class="loading">⏳ Загрузка треков...</div>';

            try {
                if (tracksListener) {
                    database.ref('tracks').off('value', tracksListener);
                }

                const timeout = setTimeout(() => {
                    tracksDiv.innerHTML = `
                        <div class="empty-state">
                            <h3>⚠️ Ошибка подключения к Firebase</h3>
                            <p style="margin-top:10px;">Откройте <b>Firebase Console → Realtime Database → Правила</b> и установите:<br><br>
                            <code style="background:#333;color:#ff8800;padding:10px;border-radius:8px;display:inline-block;margin-top:8px;">{ "rules": { ".read": true, ".write": true } }</code><br><br>
                            После этого обновите страницу.</p>
                        </div>`;
                }, 8000);

                tracksListener = database.ref('tracks').on('value', async (snapshot) => {
                    clearTimeout(timeout);
                    const tracksData = snapshot.val();

                    if (!tracksData) {
                        tracksDiv.innerHTML = `
                            <div class="empty-state">
                                <h3>🎵 Пока нет треков</h3>
                                <p>Станьте первым, кто загрузит музыку!</p>
                            </div>`;
                        return;
                    }

                    // Store tracks in memory map for playback
                    window.tracksCache = {};
                    Object.values(tracksData).forEach(t => { window.tracksCache[t.id] = t; });

                    // Get likes
                    const likesSnapshot = await database.ref('likes').once('value');
                    const likesData = likesSnapshot.val() || {};

                    const likesMap = {};
                    const userLikes = new Set();

                    Object.values(likesData).forEach(like => {
                        likesMap[like.trackId] = (likesMap[like.trackId] || 0) + 1;
                        if (currentUser && like.userId === currentUser) {
                            userLikes.add(like.trackId);
                        }
                    });

                    const tracks = Object.values(tracksData);
                    tracks.sort((a, b) => (likesMap[b.id] || 0) - (likesMap[a.id] || 0));

                    tracksDiv.innerHTML = tracks.map(track => {
                        const likesCount = likesMap[track.id] || 0;
                        const isLiked = userLikes.has(track.id);
                        const coverSrc = track.coverData || `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><rect width="140" height="140" fill="%23667eea"/><text x="50%" y="50%" font-size="60" text-anchor="middle" dy=".3em">🎵</text></svg>`;

                        return `
                        <div class="track-item">
                            <div style="position: relative; flex-shrink: 0;">
                                <img class="track-cover" src="${coverSrc}" alt="Cover">
                                <div class="waveform">
                                    <div class="wave-bar"></div>
                                    <div class="wave-bar"></div>
                                    <div class="wave-bar"></div>
                                    <div class="wave-bar"></div>
                                    <div class="wave-bar"></div>
                                    <div class="wave-bar"></div>
                                </div>
                            </div>
                            <div class="track-info">
                                <div class="track-title">${track.title}</div>
                                <div class="track-author">👤 ${track.author}</div>
                                <div class="track-controls">
                                    <button class="play-btn" id="playcard-${track.id}" onclick="playTrackById('${track.id}')">▶</button>
                                    ${currentUser
                                        ? `<button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${track.id}')" id="like-${track.id}">
                                            ${isLiked ? '❤️' : '🤍'} <span id="count-${track.id}">${likesCount}</span>
                                           </button>`
                                        : `<span style="padding: 10px; color:#999;">❤️ ${likesCount}</span>`
                                    }
                                    ${track.lyrics ? `<button onclick="showLyrics('${track.id}')" style="background:transparent;border:2px solid #667eea;color:#667eea;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px;transition:all 0.3s;" onmouseover="this.style.background='#667eea';this.style.color='white'" onmouseout="this.style.background='transparent';this.style.color='#667eea'">📝 Текст</button>` : ''}
                                    ${currentUser === track.author || currentUser === 'admin'
                                        ? `<button class="delete-btn" onclick="deleteTrack('${track.id}')">🗑️ Удалить</button>`
                                        : ''
                                    }
                                </div>
                            </div>
                        </div>`;
                    }).join('');

                }, (error) => {
                    clearTimeout(timeout);
                    tracksDiv.innerHTML = `
                        <div class="empty-state">
                            <h3>⚠️ Нет доступа к базе данных</h3>
                            <p style="margin-top:10px;">Настройте правила Realtime Database:<br><br>
                            <code style="background:#333;color:#ff8800;padding:10px;border-radius:8px;display:inline-block;margin-top:8px;">{ "rules": { ".read": true, ".write": true } }</code></p>
                        </div>`;
                });
            } catch (error) {
                console.error('Error loading tracks:', error);
                tracksDiv.innerHTML = '<div class="error-message">❌ Ошибка загрузки треков</div>';
            }
        }

        function playTrackById(trackId) {
            const track = window.tracksCache && window.tracksCache[trackId];
            if (!track) return;

            const audioPlayer = document.getElementById('audioPlayer');

            // If same track is playing — toggle pause/play
            if (currentTrack && currentTrack.id === trackId) {
                if (audioPlayer.paused) {
                    audioPlayer.play();
                    document.getElementById('playPauseBtn').textContent = '⏸';
                    setTrackCardState(trackId, true);
                } else {
                    audioPlayer.pause();
                    document.getElementById('playPauseBtn').textContent = '▶';
                    setTrackCardState(trackId, false);
                }
                return;
            }

            // New track — reset previous card
            if (currentTrack) {
                setTrackCardState(currentTrack.id, false);
            }

            playTrack(track);
        }

        function setTrackCardState(trackId, isPlaying) {
            const btn = document.getElementById('playcard-' + trackId);
            if (!btn) return;
            const card = btn.closest('.track-item');
            if (isPlaying) {
                btn.innerHTML = '⏸';
                btn.style.background = 'linear-gradient(135deg, #764ba2 0%, #667eea 100%)';
                if (card) {
                    card.style.border = '2px solid #ff5500';
                    card.style.animation = 'playingPulse 2s infinite';
                }
            } else {
                btn.innerHTML = '▶';
                btn.style.background = 'linear-gradient(135deg, #ff5500 0%, #ff8800 100%)';
                if (card) {
                    card.style.border = '';
                    card.style.animation = 'fadeIn 0.5s ease';
                }
            }
        }

        async function toggleLike(trackId) {
            if (!currentUser) {
                alert('Войдите, чтобы ставить лайки!');
                return;
            }

            try {
                const likeId = currentUser + '_' + trackId;
                const likeRef = database.ref('likes/' + likeId);
                const snapshot = await likeRef.once('value');

                const btn = document.getElementById('like-' + trackId);
                const countEl = document.getElementById('count-' + trackId);

                if (snapshot.exists()) {
                    // Remove like
                    await likeRef.remove();
                    if (btn) {
                        btn.classList.remove('liked');
                        btn.innerHTML = `🤍 <span id="count-${trackId}">${Math.max(0, parseInt(countEl ? countEl.textContent : 0) - 1)}</span>`;
                    }
                } else {
                    // Add like
                    await likeRef.set({
                        userId: currentUser,
                        trackId: trackId,
                        timestamp: Date.now()
                    });
                    if (btn) {
                        btn.classList.add('liked');
                        btn.innerHTML = `❤️ <span id="count-${trackId}">${parseInt(countEl ? countEl.textContent : 0) + 1}</span>`;
                    }
                }
            } catch (error) {
                console.error('Error toggling like:', error);
                alert('Ошибка: ' + error.message);
            }
        }

        function showLyrics(trackId) {
            const track = window.tracksCache && window.tracksCache[trackId];
            if (!track || !track.lyrics) return;

            document.getElementById('lyricsTitleModal').textContent = '📝 ' + track.title;
            document.getElementById('lyricsAuthorModal').textContent = '👤 ' + track.author;
            document.getElementById('lyricsText').textContent = track.lyrics;
            document.getElementById('lyricsModal').style.display = 'block';
        }

        async function showSaved() {
            document.getElementById('savedModal').style.display = 'block';
            const savedList = document.getElementById('savedList');
            savedList.innerHTML = '<div style="text-align:center;padding:20px;">⏳ Загрузка...</div>';

            try {
                // Get user likes
                const likesSnapshot = await database.ref('likes').once('value');
                const likesData = likesSnapshot.val() || {};
                const likedTrackIds = Object.values(likesData)
                    .filter(l => l.userId === currentUser)
                    .map(l => l.trackId);

                if (likedTrackIds.length === 0) {
                    savedList.innerHTML = `
                        <div style="text-align:center;padding:40px;color:#999;">
                            <p style="font-size:40px;">🤍</p>
                            <p style="margin-top:10px;">Вы ещё не лайкнули ни одного трека</p>
                        </div>`;
                    return;
                }

                // Get tracks from cache
                const tracks = likedTrackIds
                    .map(id => window.tracksCache && window.tracksCache[id])
                    .filter(Boolean);

                if (tracks.length === 0) {
                    savedList.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">Треки не найдены</p>';
                    return;
                }

                savedList.innerHTML = tracks.map(track => {
                    const coverSrc = track.coverData || `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect width="60" height="60" fill="%23667eea"/><text x="50%" y="50%" font-size="28" text-anchor="middle" dy=".3em">🎵</text></svg>`;
                    return `
                    <div style="display:flex;align-items:center;gap:15px;padding:15px;background:#f8f8f8;border-radius:12px;margin-bottom:10px;cursor:pointer;transition:all 0.2s;" 
                         onmouseover="this.style.background='#fff0ea'" 
                         onmouseout="this.style.background='#f8f8f8'">
                        <img src="${coverSrc}" style="width:60px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0;">
                        <div style="flex:1;">
                            <div style="font-weight:bold;color:#333;font-size:16px;">${track.title}</div>
                            <div style="color:#999;font-size:13px;">👤 ${track.author}</div>
                        </div>
                        <button onclick="playTrackById('${track.id}'); closeModal('savedModal')" 
                                style="width:45px;height:45px;background:linear-gradient(135deg,#ff5500,#ff8800);border:none;border-radius:50%;color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">▶</button>
                        <button onclick="toggleLike('${track.id}'); this.parentElement.style.opacity='0.5'; setTimeout(()=>showSaved(),500)"
                                style="padding:8px 14px;background:transparent;border:2px solid #ff5500;color:#ff5500;border-radius:20px;cursor:pointer;font-size:13px;flex-shrink:0;">🗑️ Убрать</button>
                    </div>`;
                }).join('');

            } catch (error) {
                savedList.innerHTML = '<p style="color:red;text-align:center;">Ошибка загрузки</p>';
                console.error(error);
            }
        }

        function playTrack(track) {
            const player = document.getElementById('player');
            const audioPlayer = document.getElementById('audioPlayer');

            currentTrack = track;
            audioPlayer.src = track.audioData || track.audioURL;
            document.getElementById('playerCover').src = track.coverData || track.coverURL || '';
            document.getElementById('playerTitle').textContent = track.title;
            document.getElementById('playerAuthor').textContent = track.author;

            player.style.display = 'block';
            audioPlayer.play();
            document.getElementById('playPauseBtn').textContent = '⏸';

            // Highlight card
            setTrackCardState(track.id, true);

            // When track ends — reset card
            audioPlayer.onended = () => {
                document.getElementById('playPauseBtn').textContent = '▶';
                setTrackCardState(track.id, false);
            };

            setupAudioListeners();
        }

        function togglePlay() {
            const audioPlayer = document.getElementById('audioPlayer');
            const btn = document.getElementById('playPauseBtn');

            if (audioPlayer.paused) {
                audioPlayer.play();
                btn.textContent = '⏸';
                if (currentTrack) setTrackCardState(currentTrack.id, true);
            } else {
                audioPlayer.pause();
                btn.textContent = '▶';
                if (currentTrack) setTrackCardState(currentTrack.id, false);
            }
        }

        function setupAudioListeners() {
            const audioPlayer = document.getElementById('audioPlayer');
            const seekSlider = document.getElementById('seekSlider');
            const volumeSlider = document.getElementById('volumeSlider');

            audioPlayer.removeEventListener('timeupdate', updateProgress);
            audioPlayer.addEventListener('timeupdate', updateProgress);

            audioPlayer.addEventListener('loadedmetadata', function() {
                document.getElementById('duration').textContent = formatTime(audioPlayer.duration);
            });

            seekSlider.removeEventListener('input', handleSeek);
            seekSlider.addEventListener('input', handleSeek);

            volumeSlider.removeEventListener('input', handleVolume);
            volumeSlider.addEventListener('input', handleVolume);
        }

        function handleSeek() {
            const audioPlayer = document.getElementById('audioPlayer');
            const seekSlider = document.getElementById('seekSlider');
            audioPlayer.currentTime = (audioPlayer.duration * seekSlider.value) / 100;
        }

        function handleVolume() {
            const audioPlayer = document.getElementById('audioPlayer');
            audioPlayer.volume = document.getElementById('volumeSlider').value / 100;
            updateVolumeIcon();
        }

        function updateProgress() {
            const audioPlayer = document.getElementById('audioPlayer');
            if (audioPlayer.duration) {
                document.getElementById('seekSlider').value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                document.getElementById('currentTime').textContent = formatTime(audioPlayer.currentTime);
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function toggleMute() {
            const audioPlayer = document.getElementById('audioPlayer');
            const volumeSlider = document.getElementById('volumeSlider');
            
            if (audioPlayer.volume > 0) {
                audioPlayer.dataset.previousVolume = audioPlayer.volume;
                audioPlayer.volume = 0;
                volumeSlider.value = 0;
            } else {
                const prevVolume = audioPlayer.dataset.previousVolume || 1;
                audioPlayer.volume = prevVolume;
                volumeSlider.value = prevVolume * 100;
            }
            updateVolumeIcon();
        }

        function updateVolumeIcon() {
            const audioPlayer = document.getElementById('audioPlayer');
            const volumeIcon = document.getElementById('volumeIcon');
            
            if (audioPlayer.volume === 0) {
                volumeIcon.textContent = '🔇';
            } else if (audioPlayer.volume < 0.5) {
                volumeIcon.textContent = '🔉';
            } else {
                volumeIcon.textContent = '🔊';
            }
        }

        async function deleteTrack(trackId) {
            if (!confirm('Вы уверены, что хотите удалить этот трек?')) {
                return;
            }

            try {
                await database.ref('tracks/' + trackId).remove();
                
                // Delete associated likes
                const likesSnapshot = await database.ref('likes').once('value');
                const likesData = likesSnapshot.val() || {};
                for (const [likeId, like] of Object.entries(likesData)) {
                    if (like.trackId === trackId) {
                        await database.ref('likes/' + likeId).remove();
                    }
                }
                
                if (currentTrack && currentTrack.id === trackId) {
                    document.getElementById('player').style.display = 'none';
                    document.getElementById('audioPlayer').pause();
                    currentTrack = null;
                }
            } catch (error) {
                console.error('Error deleting track:', error);
                alert('Ошибка удаления трека');
            }
        }

        document.getElementById('coverFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('coverPreview').innerHTML = 
                        `<img src="${event.target.result}" style="width: 200px; height: 200px; object-fit: cover; margin-top: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">`;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
